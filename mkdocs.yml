# Frida 学习网站 —— MkDocs Material 配置
# 站点源目录直接指向 skills/frida 知识库（172 个文档零复制、一处维护）。
# 构建: pip install mkdocs-material && mkdocs build
# 部署: .github/workflows/pages.yml → GitHub Actions → GitHub Pages

site_name: Frida 学习站
site_description: 从概念、核心 API、CLI 到 Android/iOS 实战 —— Frida 动态插桩学习知识库
site_url: https://android-security-engineer.github.io/frida-skills/
repo_url: https://github.com/android-security-engineer/frida-skills
repo_name: android-security-engineer/frida-skills
docs_dir: skills/frida
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

validation:
  omitted_files: warn
  absolute_links: warn
  links:
    not_found: warn
    anchors: warn

copyright: Frida 学习站 — 基于 frida-skills 知识库构建

